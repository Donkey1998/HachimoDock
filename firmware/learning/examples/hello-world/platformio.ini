; ESP32-P4 串口 Hello World —— 最小可独立运行的 PlatformIO 工程
; 注意:PlatformIO 的 ESP-IDF 构建拒绝带空格的路径,本机请经 junction 路径操作(见 README 常见问题)
; 编译:pio run -d E:/HachimoDock/firmware/learning/examples/hello-world
; 烧录:pio run -d E:/HachimoDock/firmware/learning/examples/hello-world -t upload
; 监视:pio run -d E:/HachimoDock/firmware/learning/examples/hello-world -t monitor
[env:hello_world]
; ESP32-P4 尚未进官方 espressif32 平台,这里沿用主工程的 pioarduino 平台(已缓存到本机)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
board = esp32-p4-wlk2802-32mb
framework = espidf
; 控制台走 UART0(经板上 CH343 串口桥),ESP-IDF 默认波特率 115200
monitor_speed = 115200
upload_speed = 921600
